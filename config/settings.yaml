# Configurações do pipeline (ver src/relatorio_pedidos/config/settings.py).
# Variáveis de ambiente PEDIDOS_PATH, PAGAMENTOS_PATH, OUTPUT_PATH e ANO_RELATORIO
# têm precedência sobre este arquivo.
spark:
  app_name: relatorio-pedidos-recusados-legitimos
  master: "local[*]"
  shuffle_partitions: 8
  timezone: UTC  # fuso usado para interpretar os timestamps; UTC mantém data_pedido idêntica ao CSV em qualquer leitor

paths:
  pedidos: data/input/datasets-csv-pedidos/data/pedidos/
  pagamentos: data/input/dataset-json-pagamentos/data/pagamentos/
  output: data/output/relatorio_pedidos

file_options:
  mode: FAILFAST
  pedidos_csv:
    sep: ";"
    header: true
    compression: gzip
  pagamentos_json:
    compression: gzip

output:
  mode: overwrite
  partitions: 1

negocio:
  ano_relatorio: 2025
